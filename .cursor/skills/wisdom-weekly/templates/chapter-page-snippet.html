<!-- 章节页片段（每期复制，保证每页中英双语） -->
<div class="page chapter">
  <div class="page-masthead">
    <div>
      <div class="brand">Wisdom Weekly</div>
      <div class="brand-zh">智者周刊</div>
    </div>
    <div>
      <div class="chapter-mini">{{CHAPTER_LABEL_EN}}</div>
      <div class="chapter-mini-zh">{{CHAPTER_LABEL_ZH}}</div>
    </div>
  </div>
  <div class="chapter-header">
    <div class="chapter-label">{{CHAPTER_NUM}}</div>
    <div class="chapter-title-en">{{CHAPTER_TITLE_EN}}</div>
    <div class="chapter-title-zh">{{CHAPTER_TITLE_ZH}}</div>
  </div>
  <div class="insight-block">
    <div class="insight-head">
      <div class="insight-title-zh">{{INSIGHT_TITLE_ZH}}</div>
      <div class="insight-title-en">{{INSIGHT_TITLE_EN}}</div>
    </div>
    <div class="body-bilingual">
      <div class="body-bilingual-label"><span class="zh">正文</span><span class="en">Body</span></div>
      {{INSIGHT_BODY_PAIRS}}
    </div>
    <div class="core-insight">
      <div class="core-label"><span class="zh">核心洞察</span><span class="en">Core Insight</span></div>
      <p class="quote-zh">{{CORE_ZH}}</p>
      <p class="quote-en">{{CORE_EN}}</p>
    </div>
  </div>
  <div class="page-foot">
    <div class="foot-chapter">{{FOOT_ZH}}<span class="en">{{FOOT_EN}}</span></div>
    <div class="foot-num">{{PAGE_NUM}}</div>
  </div>
</div>
