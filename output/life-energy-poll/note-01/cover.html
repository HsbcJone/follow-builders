<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1440px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    }
    .wrap {
      text-align: center;
      padding: 80px;
      max-width: 920px;
    }
    h1 {
      color: #111111;
      font-size: 96px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -2px;
    }
    p {
      margin-top: 48px;
      color: #666666;
      font-size: 40px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>最影响你<br>状态的是？</h1>
    <p>点投票 · 3 秒</p>
  </div>
</body>
</html>
